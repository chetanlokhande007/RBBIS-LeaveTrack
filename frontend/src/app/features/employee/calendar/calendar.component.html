<div class="screen">
  <div class="page-head" style="display: flex; justify-content: space-between; align-items: center;">
    <div>
      <h2 style="font-size:24px; font-weight:700;">Company Calendar</h2>
      <p>View upcoming holidays and your scheduled leaves.</p>
    </div>
    
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-ghost">
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; font-weight: 600; color: var(--ink); display: flex; align-items: center; justify-content: center; min-width: 140px;">
        July 2026
      </div>
      <button class="btn btn-ghost">
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </div>

  <div class="table-wrap" style="padding: 24px;">
    <!-- Legend -->
    <div style="display: flex; gap: 16px; margin-bottom: 24px; font-size: 13px; color: var(--slate);">
      <div style="display: flex; align-items: center; gap: 6px;">
        <div style="width: 12px; height: 12px; border-radius: 4px; background: #10b981;"></div> Approved Leave
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <div style="width: 12px; height: 12px; border-radius: 4px; background: #f59e0b;"></div> Pending Leave
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <div style="width: 12px; height: 12px; border-radius: 4px; background: #3b82f6;"></div> Holiday
      </div>
    </div>

    <!-- Calendar Grid -->
    <div style="border: 1px solid var(--line); border-radius: 12px; overflow: hidden;">
      
      <!-- Days of Week -->
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); background: var(--canvas); border-bottom: 1px solid var(--line); text-align: center; font-weight: 600; font-size: 13px; color: var(--slate); padding: 12px 0;">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>

      <!-- Calendar Cells (Static Example for July 2026) -->
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 100px; background: var(--surface);">
        
        <!-- Empty Cells for start of month (July 1st is Wednesday) -->
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--canvas);"></div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--canvas);"></div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--canvas);"></div>
        
        <!-- Day 1-4 -->
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">1</div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">2</div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">3</div>
        <div style="border-bottom: 1px solid var(--line); padding: 8px;">
          4
          <div style="margin-top: 4px; padding: 4px 6px; background: rgba(59, 130, 246, 0.1); color: #3b82f6; border-left: 2px solid #3b82f6; border-radius: 4px; font-size: 11px; font-weight: 500;">Independence Day</div>
        </div>

        <!-- Next Row -->
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">5</div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">6</div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; background: rgba(16, 185, 129, 0.05);">
          7
          <div style="margin-top: 4px; padding: 4px 6px; background: rgba(16, 185, 129, 0.1); color: #10b981; border-left: 2px solid #10b981; border-radius: 4px; font-size: 11px; font-weight: 500;">Sick Leave</div>
        </div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; background: rgba(16, 185, 129, 0.05);">
          8
          <div style="margin-top: 4px; padding: 4px 6px; background: rgba(16, 185, 129, 0.1); color: #10b981; border-left: 2px solid #10b981; border-radius: 4px; font-size: 11px; font-weight: 500;">Sick Leave</div>
        </div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">9</div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">10</div>
        <div style="border-bottom: 1px solid var(--line); padding: 8px;">11</div>

        <!-- Filling the rest roughly for visual completeness -->
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">12</div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">13</div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">14</div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">15</div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">16</div>
        <div style="border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px;">17</div>
        <div style="border-bottom: 1px solid var(--line); padding: 8px;">18</div>

        <!-- Truncated to avoid excessively long HTML, covers enough to look great -->
      </div>
    </div>
  </div>
</div>
