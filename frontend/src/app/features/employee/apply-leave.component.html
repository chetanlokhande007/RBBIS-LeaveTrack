<div class="screen">
  <div class="page-head" style="margin-bottom: 32px;">
    <h2 style="font-size:28px; font-weight:800; letter-spacing:-0.02em;">Apply Leave</h2>
    <p style="font-size: 15px; color: var(--slate); margin-top: 4px;">Submit a new leave application. Your manager will be notified to review and action your request.</p>
  </div>

  <div style="background: var(--surface); padding: 32px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--surface-solid); max-width: 640px; backdrop-filter: var(--glass-blur);">
    <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()">

      <!-- Balance Hint alert box -->
      <div style="background: rgba(79, 70, 229, 0.08); color: var(--primary); padding: 16px 20px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 14px; margin-bottom: 28px; border: 1px solid rgba(79, 70, 229, 0.15);">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
          <line x1="7" y1="7" x2="7.01" y2="7"></line>
        </svg>
        <span>Your current remaining balance for this type is: <strong id="balance-hint-text" style="font-weight: 700; margin-left: 4px;">{{ selectedBalanceHint }}</strong></span>
      </div>

      <div class="field" style="margin-bottom: 24px;">
        <label>Leave Type</label>
        <select formControlName="leaveTypeId" required>
          <option value="" disabled selected>Select leave category</option>
          <option *ngFor="let t of leaveTypes" [value]="t.id">{{ t.name }}</option>
        </select>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
        <div class="field" style="margin-bottom: 0;">
          <label>Start Date</label>
          <input type="date" formControlName="startDate" required>
        </div>
        <div class="field" style="margin-bottom: 0;">
          <label>End Date</label>
          <input type="date" formControlName="endDate" required>
        </div>
      </div>

      <div class="field" style="margin-bottom: 32px;">
        <label>Reason / Comments</label>
        <textarea formControlName="reason" placeholder="Please provide details about your leave request..." maxlength="500" required style="min-height: 120px; resize: vertical;"></textarea>
      </div>

      <div style="display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 24px;">
        <button type="submit" class="btn btn-primary" [disabled]="leaveForm.invalid || submitting">
          <span *ngIf="!submitting">Submit Application</span>
          <span *ngIf="submitting">Submitting...</span>
        </button>
        <button type="button" class="btn btn-ghost" routerLink="/employee/dashboard">Cancel</button>
      </div>

    </form>
  </div>
</div>
