      <!-- Header -->
      <header class="header">
        <div class="header-container">
          <div class="logo-area">
            <img src="rbislogo.png" alt="RBIS Logo" class="header-img-logo">
            <span class="logo-text">RBIS Leaver Tracker</span>
          </div>
          
          <nav class="main-nav" [class.mobile-open]="isMenuOpen">
            <a (click)="isMenuOpen = false" routerLink="/" class="nav-link active">Home</a>
            <a (click)="isMenuOpen = false" routerLink="/" fragment="features" class="nav-link">Features</a>
            <a (click)="isMenuOpen = false" routerLink="/" fragment="how-it-works" class="nav-link">How It Works</a>
            <a (click)="isMenuOpen = false" routerLink="/benefits" class="nav-link">Benefits</a>
            <a (click)="isMenuOpen = false" routerLink="/faq" class="nav-link">FAQ</a>
            <a (click)="isMenuOpen = false" routerLink="/contact" class="nav-link">Contact Us</a>
          </nav>
          
          <button class="mobile-menu-btn" (click)="toggleMenu()" aria-label="Toggle menu">
            <svg *ngIf="!isMenuOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="24" height="24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg *ngIf="isMenuOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="24" height="24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
          
          <div class="header-actions">
            <a routerLink="/login" class="btn btn-primary btn-login">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              Login
            </a>
            <a href="#" class="btn btn-outline btn-demo">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              Request Demo
            </a>
          </div>
        </div>
      </header>
