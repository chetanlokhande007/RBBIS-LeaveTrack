<div class="page-wrapper">
  <app-header></app-header>
  
  <section id="contact" class="contact-section">
        <div class="contact-box">
          <div class="contact-info">
            <h2>Get in Touch</h2>
            <p>Have questions about implementation or pricing? Our team is ready to help you optimize your HR workflow.</p>
            <div class="contact-methods">
              <div class="method"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg> hello&#64;rbistechnology.com</div>
              <div class="method"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg> +1 (800) 555-0199</div>
            </div>
          </div>
          <div class="contact-form">
            <input type="text" placeholder="Your Name" class="form-input" [(ngModel)]="formData.name">
            <input type="email" placeholder="Your Email" class="form-input" [(ngModel)]="formData.email">
            <textarea placeholder="How can we help?" rows="3" class="form-input" [(ngModel)]="formData.message"></textarea>
            
            <div *ngIf="errorMessage" class="error-msg" style="color: #dc2626; font-size: 0.875rem;">{{errorMessage}}</div>
            <div *ngIf="successMessage" class="success-msg" style="color: #16a34a; font-size: 0.875rem;">{{successMessage}}</div>
            
            <button class="btn btn-primary w-full" (click)="sendMessage()" [disabled]="isSubmitting">
              {{ isSubmitting ? 'Sending...' : 'Send Message' }}
            </button>
          </div>
        </div>
      </section>
      
  <app-footer></app-footer>
</div>
