<div class="topbar" style="background: var(--canvas); border-bottom: 1px solid var(--line); padding: 0 24px;">
  <div style="display:flex; align-items:center; gap: 16px; flex: 1;">
    <button class="hamburger-btn" (click)="layoutService.toggleSidebar()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    
    <!-- Search Bar -->
    <div style="position: relative; width: 400px;">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 16px; top: 12px; color: var(--slate);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" placeholder="Search for employees, requests..." style="width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px 10px 44px; color: var(--ink); font-size: 14px;">
    </div>
  </div>
  
  <div class="topbar-right" style="gap: 16px;">
    <!-- Theme Toggle -->
    <button class="bell-btn" (click)="themeService.toggleTheme()" title="Toggle Theme" style="background: var(--surface); border: 1px solid var(--line);">
      <svg *ngIf="themeService.currentTheme === 'dark'" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg *ngIf="themeService.currentTheme === 'light'" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <!-- Notification Bell -->
    <div class="bell-wrap">
      <button class="bell-btn" (click)="toggleBell($event)" style="background: var(--surface); border: 1px solid var(--line);">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <div class="bell-dot" style="background: #00d284; border-color: var(--surface);">3</div>
      </button>
      
      <!-- Bell Panel Dropdown -->
      <div class="dropdown-panel" *ngIf="bellOpen" (click)="$event.stopPropagation()">
        <div class="dh">Notifications</div>
        <div class="notif-item">
          <div class="t">Holiday Announcement</div>
          <div class="s">Independence Day holiday is upcoming on Aug 15.</div>
        </div>
        <div class="notif-item">
          <div class="t">Leave System Active</div>
          <div class="s">You can submit and manage leaves online.</div>
        </div>
      </div>
    </div>

    <!-- User Trigger Menu -->
    <div class="user-menu-wrap" style="margin-left: 8px;">
      <button class="user-trigger" (click)="toggleUserMenu($event)" style="background: transparent; padding: 0;">
        <div class="avatar sm" style="background: #00d284; color: #fff; width: 32px; height: 32px; font-size: 13px;">AD</div>
        <span style="font-weight: 500; font-size: 14px; margin: 0 8px;">Admin User</span>
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--slate);"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      
      <!-- User Menu Panel -->
      <div class="user-menu-panel" *ngIf="userMenuOpen" (click)="$event.stopPropagation()">
        <div class="um-label">System Actions</div>
        <button class="um-item" (click)="logout()">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</div>
